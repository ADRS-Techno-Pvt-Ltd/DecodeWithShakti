<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Decode with Shakti — Card not found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAF8FF;
    --paper: #FFFFFF;
    --ink: #201C33;
    --ink-soft: #625C78;
    --indigo: #4F46E5;
    --indigo-deep: #38309E;
    --lavender: #EFECFE;
    --line: #DDD6F7;
    --line-strong: #C6BCF5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(var(--line-strong) 0.7px, transparent 0.7px),
      var(--bg);
    background-size:22px 22px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 32px;}

  header{
    border-bottom:1px solid var(--line);
    padding:22px 0;
    background:linear-gradient(var(--bg) 60%, transparent);
  }
  .headerbar{display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:10px;}
  .mark{
    width:32px;height:32px;border-radius:8px;background:var(--indigo);
    color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;
  }
  .brand span{font-weight:600;font-size:16px;letter-spacing:-0.01em;}
  .back{font-size:14px;color:var(--ink-soft);text-decoration:none;}
  .back:hover{color:var(--indigo);}

  main{
    padding:80px 0 100px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--indigo-deep);
    background:var(--lavender);
    display:inline-block;
    padding:5px 12px;
    border-radius:5px;
    border:1px solid var(--line-strong);
    margin-bottom:40px;
  }

  .stamp404{
    width:168px;height:168px;
    border:2px solid var(--indigo);
    border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transform:rotate(-9deg);
    margin-bottom:36px;
    position:relative;
    background:var(--paper);
  }
  .stamp404::before{
    content:'';position:absolute;inset:9px;border:1.5px dashed var(--indigo);border-radius:50%;
  }
  .stamp404 .num{
    font-family:'Fraunces',serif;font-weight:600;font-size:46px;color:var(--indigo);line-height:1;
  }
  .stamp404 .cap{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--indigo-deep);margin-top:6px;
  }

  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:42px;
    line-height:1.1;
    letter-spacing:-0.01em;
    margin:0 0 16px;
    max-width:560px;
  }

  .lede{
    font-size:16px;
    line-height:1.65;
    color:var(--ink-soft);
    max-width:440px;
    margin:0 0 44px;
  }

  /* empty index card */
  .empty-card{
    position:relative;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:2px 14px 14px 14px;
    padding:26px 30px 28px;
    width:100%;
    max-width:420px;
    margin-bottom:44px;
  }
  .empty-card .tab{
    position:absolute;top:-17px;left:24px;
    background:var(--paper);
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:7px 7px 0 0;
    padding:3px 11px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-soft);
  }
  .empty-card .line{
    height:11px;
    border-radius:3px;
    background:repeating-linear-gradient(90deg, var(--line) 0 10px, transparent 10px 14px);
    margin-bottom:14px;
  }
  .empty-card .line:nth-child(2){width:78%;}
  .empty-card .line:nth-child(3){width:92%;}
  .empty-card .line:nth-child(4){width:55%;margin-bottom:0;}

  .cta-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;}
  .btn-primary{
    background:var(--indigo);color:#fff;border:none;
    font-family:'Inter',sans-serif;font-weight:500;font-size:14.5px;
    padding:12px 22px;border-radius:8px;cursor:pointer;text-decoration:none;
    display:inline-flex;align-items:center;gap:8px;
    transition:background .15s ease;
  }
  .btn-primary:hover{background:var(--indigo-deep);}
  .btn-ghost{
    display:inline-flex;align-items:center;gap:7px;
    font-size:14px;font-weight:500;color:var(--indigo);
    border:1px solid var(--line-strong);background:var(--lavender);
    padding:11px 18px;border-radius:20px;text-decoration:none;
    transition:background .15s ease;
  }
  .btn-ghost:hover{background:#E4DEFC;}
</style>
</head>
<body>

<header>
  <div class="wrap headerbar">
    <div class="brand">
      <div class="mark">D</div>
      <span>Decode with Shakti</span>
    </div>
    <a class="back" href="#">Back to home</a>
  </div>
</header>

<main class="wrap">

  <div class="stamp404">
    <div class="num">404</div>
    <div class="cap">page not found</div>
  </div>

  <h1>We couldn't find that page.</h1>
  <p class="lede">The link may be broken, or the page may have moved. Nothing to worry about — head back home or check the FAQ for quick answers.</p>

  <div class="empty-card">
    <span class="tab">Nothing here</span>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
  </div>

  <div class="cta-row">
    <a class="btn-primary" href="#">Back to home →</a>
    <a class="btn-ghost" href="#">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      Browse the FAQ
    </a>
  </div>

</main>

</body>
</html>
